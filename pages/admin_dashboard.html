<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - InsideTheCell</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .dashboard-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            color: #ff5a0a;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #3d5381;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .textarea-large {
            height: 150px;
            white-space: pre-wrap;
        }

        input:focus, textarea:focus {
            border-color: #3d5381;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        .btn-save {
            background-color: #3d5381;
            color: white;
        }

        .btn-save:hover {
            background-color: #2c3e50;
        }

        #status-message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #ff5a0a;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 30px 0 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid #ff5a0a;
        }

        .divider::before {
            margin-right: 15px;
        }

        .divider::after {
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>Admin Dashboard</h1>
        
        <div class="form-group">
            <label for="api-key">Gemini API Key</label>
            <input type="password" id="api-key" placeholder="Insert your Gemini API Key here...">
        </div>

        <div class="form-group">
            <label for="generic-prompt">Prompt</label>
            <textarea id="generic-prompt" class="textarea-large" placeholder="Insert the base instructions for the AI..."></textarea>
        </div>

        <div class="form-group">
            <label for="infection-phases">Infection phases (numbered list)</label>
            <textarea id="infection-phases" class="textarea-large" placeholder="Insert infection phases..."></textarea>
        </div>

        <div class="form-group">
            <label for="minigame-descriptions">Minigames descriptions (numbered list)</label>
            <textarea id="minigame-descriptions" class="textarea-large" placeholder="Insert descriptions for the minigames..."></textarea>
        </div>

        <div class="form-group">
            <label for="minigame-knowledge">Minigame knowledge (numbered list)</label>
            <textarea id="minigame-knowledge" class="textarea-large" placeholder="Insert knowledge for the minigames..."></textarea>
        </div>

        <div class="form-group">
            <label for="quizzes">Minigames quizzes (numbered list)</label>
            <textarea id="quizzes" class="textarea-large" placeholder="Insert the quizzes..."></textarea>
        </div>

        <div class="divider">Offline mode defaults</div>

        <div class="form-group">
            <label for="default-chat-responses">Default chat responses (numbered list)</label>
            <textarea id="default-chat-responses" class="textarea-large" placeholder="Insert the default responses for the chat..."></textarea>
        </div>

        <div class="form-group">
            <label for="default-postgame-info">Default postgame information text (numbered list)</label>
            <textarea id="default-postgame-info" class="textarea-large" placeholder="Insert the default postgame information..."></textarea>
        </div>

        <div class="button-group">
            <button class="btn-reset" onclick="resetAdminSettings()">Reset</button>
            <button class="btn-save" onclick="saveAdminSettings()">Save</button>
        </div>

        <p id="status-message"></p>
    </div>

    <script>
        const DEFAULTS = {
            //TODO: add missing default values
            'GEMINI_API_KEY': '',
            'GAME_PROMPT': 'You are an AI tutor in an educational video game about viral infection phases, designed for middle and high school students. The player needs to complete a minigame for each phase of the viral infection process. After each minigame the player can ask you questions about the phase they just played and the related minigame, and you will answer based on the specific knowledge provided for that phase and minigame. If the player asks a question that is not related to the current phase and minigame, you will answer based on the general knowledge you have about viral infections. Always keep in mind that your answers should be appropriate for middle and high school students, avoiding technical jargon and providing clear explanations.',
            'INFECTION_PHASES': '1: Adhesion\n2: Penetration\n3: ...',
            'MINIGAME_DESCRIPTIONS': '1: The objective of the minigame is to prevent viruses falling from the top of the screen from binding to the receptors located on the cell membrane. The player controls a movable cart to catch the viruses before they can successfully attach to a receptor.\n2: The objective of the minigame is to prevent viruses from entering the cell membrane. The player controls the crosshair and can destroy the viruses before reaching the entry point, if too many viruses get through they enters the cell.\n3: The objective of the minigame is to complete the platform path before the virus at the top of the screen fully opens and releases its genome. The player controls the character through platforms and spikes (if the player touches a spikes it respawns at the start), trying to reach the final flag before time runs out; if the timer runs out the genome is relased and the level is failed.\n4: ...',
            'MINIGAME_KNOWLEDGES': '1: During the binding phase, viruses use their surface proteins to attach to specific receptors on the host cell. This lock-and-key mechanism is the mandatory first step for the virus to enter the cell and cause an infection.\n2: Remember that after binding to the cell receptors, viruses can enter the cell by crossing the membrane. They do this through mechanisms like membrane fusion or endocytosis. Stopping the virus before it enters is essential to prevent the infection from progressing.\n3: After entering the cell, the virus releases its genetic material into the host cell. This step is called genome release or uncoating. Once the viral genome is free inside the cell, it can take control of the host machinery and begin producing new viral components\n4: ...',
            'QUIZZES': '1: What is the mandatory first step for a virus to enter a cell and cause an infection?\n1a(F): Replicating inside the nucleus\n1b(F): Destroying the host cell\n1c(T): The binding phase\n1: How do viruses attach to the host cell during the binding phase?\n1a(F): By releasing toxins into the surrounding area\n1b(T): By using their surface proteins to attach to specific receptors\n1c(F): By piercing the cell membrane with a tail\n1: What analogy is used to describe how viral surface proteins interact with host cell receptors?\n1a(F): A magnet attracting iron\n1b(T): A lock-and-key mechanism\n1c(F): A sponge absorbing water\n1: Which part of the virus is responsible for attaching to the host cell?\n1a(F): The viral nucleus\n1b(F): Internal DNA\n1c(T): Surface proteins\n1: What must the viral surface proteins attach to on the host cell?\n1a(F): Random parts of the membrane\n1b(T): Specific receptors\n1c(F): The cell\'s DNA\n2: What happens immediately after a virus binds to a host cell?\n2a(F): It destroys the cell instantly\n2b(T): It attempts to enter the cell\n2c(F): It starts replicating outside the cell\n2: What is the main goal of the virus during the entry phase?\n2a(F): To replicate its DNA immediately\n2b(F): To attack other viruses\n2c(T): To cross the cell membrane\n2: Which structure must the virus cross to enter the cell?\n2a(F): The mitochondria\n2b(T): The cell membrane\n2c(F): The nucleus\n2: Which process allows the virus to merge with the host cell membrane?\n2a(F): DNA replication\n2b(T): Membrane fusion\n2c(F): Protein synthesis\n2: Which mechanism allows the cell to engulf the virus during entry?\n2a(F): Photosynthesis\n2b(F): Respiration\n2c(T): Endocytosis\n3: What happens during the genome release phase?\n3a(F): The virus attaches to the cell receptors\n3b(T): The virus releases its genetic material inside the host cell\n3c(F): The virus leaves the cell immediately\n3: What is another name for genome release?\n3a(T): Uncoating\n3b(F): Binding\n3c(F): Membrane fusion\n3: Why is genome release dangerous for the host cell?\n3a(F): Because it prevents the virus from entering the cell\n3b(F): Because it destroys the viral genome\n3c(T): Because the viral genome can take control of the host cell machinery\n3: What does the virus release during the genome release phase?\n3a(F): Cell receptors\n3b(T): Its genetic material\n3c(F): Oxygen molecules\n3: What can happen after the viral genome is released inside the cell?\n3a(T): The host cell can begin producing new viral components\n3b(F): The virus becomes harmless\n3c(F): The cell membrane disappears\n3: Where is the viral genome released?\n3a(F): Outside the host cell\n3b(F): On the cell surface receptors\n3c(T): Inside the host cell\n3: Why is it important to stop the virus before genome release?\n3a(F): To help the virus attach better\n3b(T): To prevent the infection from advancing\n3c(F): To make the virus enter faster\n3: Which phase comes before the virus can use the host machinery to produce new viral components?\n3a(F): Photosynthesis\n3b(T): Genome release\n3c(F): Cell division\n4: ...',
            'DEFAULT_CHAT_RESPONSES': '1: Remember that during the binding phase, viruses must use their surface proteins to attach to specific cell receptors like a lock and key.\n2: Remember that after binding to the cell receptors, viruses can enter the cell by crossing the membrane. They do this through mechanisms like membrane fusion or endocytosis. Stopping the virus before it enters is essential to prevent the infection from progressing.\n3: Remember that after entering the cell, the virus releases its genetic material during a process called genome release or uncoating. Once the viral genome is free inside the host cell, it can take control of the cell machinery and start producing new viral components\n4: ...',
            'DEFAULT_POSTGAME_INFO': '1a: The virus reached the cell!\n1b: You were not able to stop it in time.\nThe virus reached the receptors on the surface of the cell and attached to it.\nThis is the first step of the infection.\n2a: Viruses entered the membrane!\n2b: You were not able to stop them in time.\nThe virus fused with the cell membrane.\nThis is the second step of the infection.\n3a: The viral genome was released!\n3b: You were not able to reach the end in time.\nThe virus opened and released its genetic material inside the cell.\nNow the viral genome can take control of the host cell machinery and start producing new viral components.\nThis is the third step of the infection.\n4a: ...'
        };

        window.onload = () => {
            document.getElementById('api-key').value = localStorage.getItem('GEMINI_API_KEY') || DEFAULTS['GEMINI_API_KEY'];
            document.getElementById('generic-prompt').value = localStorage.getItem('GAME_PROMPT') || DEFAULTS['GAME_PROMPT'];
            document.getElementById('infection-phases').value = localStorage.getItem('INFECTION_PHASES') || DEFAULTS['INFECTION_PHASES'];
            document.getElementById('minigame-descriptions').value = localStorage.getItem('MINIGAME_DESCRIPTIONS') || DEFAULTS['MINIGAME_DESCRIPTIONS'];
            document.getElementById('minigame-knowledge').value = localStorage.getItem('MINIGAME_KNOWLEDGES') || DEFAULTS['MINIGAME_KNOWLEDGES'];
            document.getElementById('quizzes').value = localStorage.getItem('QUIZZES') || DEFAULTS['QUIZZES'];
            document.getElementById('default-chat-responses').value = localStorage.getItem('DEFAULT_CHAT_RESPONSES') || DEFAULTS['DEFAULT_CHAT_RESPONSES'];
            document.getElementById('default-postgame-info').value = localStorage.getItem('DEFAULT_POSTGAME_INFO') || DEFAULTS['DEFAULT_POSTGAME_INFO'];
        };

        function saveAdminSettings() {
            const apiKey = document.getElementById('api-key').value.trim();
            const prompt = document.getElementById('generic-prompt').value;
            const phases = document.getElementById('infection-phases').value;
            const minigameDescriptions = document.getElementById('minigame-descriptions').value;
            const minigameKnowledge = document.getElementById('minigame-knowledge').value;
            const quizzes = document.getElementById('quizzes').value;
            const defaultChatResponses = document.getElementById('default-chat-responses').value;
            const defaultPostgameInfo = document.getElementById('default-postgame-info').value;

            localStorage.setItem('GEMINI_API_KEY', apiKey);
            localStorage.setItem('GAME_PROMPT', prompt);
            localStorage.setItem('INFECTION_PHASES', phases);
            localStorage.setItem('MINIGAME_DESCRIPTIONS', minigameDescriptions);
            localStorage.setItem('MINIGAME_KNOWLEDGES', minigameKnowledge);
            localStorage.setItem('QUIZZES', quizzes);
            localStorage.setItem('DEFAULT_CHAT_RESPONSES', defaultChatResponses);
            localStorage.setItem('DEFAULT_POSTGAME_INFO', defaultPostgameInfo);

            showStatusMessage('Settings saved successfully! Redirecting...', '#27ae60', '#e8f8f5');

            setTimeout(() => {
                window.location.href = '/index.html';
            }, 1000);
        }

        function resetAdminSettings() {
            localStorage.removeItem('GEMINI_API_KEY');
            localStorage.removeItem('GAME_PROMPT');
            localStorage.removeItem('INFECTION_PHASES');
            localStorage.removeItem('MINIGAME_DESCRIPTIONS');
            localStorage.removeItem('MINIGAME_KNOWLEDGES');
            localStorage.removeItem('QUIZZES');
            localStorage.removeItem('DEFAULT_CHAT_RESPONSES');
            localStorage.removeItem('DEFAULT_POSTGAME_INFO');

            document.getElementById('api-key').value = DEFAULTS['GEMINI_API_KEY'];
            document.getElementById('generic-prompt').value = DEFAULTS['GAME_PROMPT'];
            document.getElementById('infection-phases').value = DEFAULTS['INFECTION_PHASES'];
            document.getElementById('minigame-descriptions').value = DEFAULTS['MINIGAME_DESCRIPTIONS'];
            document.getElementById('minigame-knowledge').value = DEFAULTS['MINIGAME_KNOWLEDGES'];
            document.getElementById('quizzes').value = DEFAULTS['QUIZZES'];
            document.getElementById('default-chat-responses').value = DEFAULTS['DEFAULT_CHAT_RESPONSES'];
            document.getElementById('default-postgame-info').value = DEFAULTS['DEFAULT_POSTGAME_INFO'];

            showStatusMessage('Settings reset to default values.', '#e74c3c', '#fdedec');
        }

        function showStatusMessage(text, textColor, backgroundColor) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.textContent = text;
            statusMsg.style.color = textColor;
            statusMsg.style.backgroundColor = backgroundColor;
            statusMsg.style.display = 'block';

            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
