<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsideTheCell - Selezione Controllo</title>
  <style>
    /* Reset base per rimuovere i margini e bloccare lo scorrimento */
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    /* Imposta l'immagine di sfondo a schermo intero */
    #background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Adatta l'immagine coprendo tutto lo schermo senza deformarla */
      z-index: 0; /* Lo mette sul livello più basso */
    }

    /* Il contenitore dove Phaser andrà a iniettare il canvas del menu */
    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Assicura che i bottoni e la telecamera stiano SOPRA lo sfondo HTML */
    }
  </style>
</head>
<body>
  
  <img id="background" src="/assets/backgroundlevelselection.png" alt="Sfondo Livelli"/>

  <div id="app"></div>

  <script type="module" src="/src/options.ts"></script>
  
</body>
</html>
